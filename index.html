<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050507">
<title>ESUKA AI 2.0</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
 --bg: #050507;
 --panel: #0d0d12;
 --panel2: #14141c;
 --card: #121218;
 --text: #ededf5;
 --muted: #8a8a9e;
 --border: #222230;
 --input: #0a0a0e;
 --bubble: #13131b;
 --user: #222232;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
 background:var(--bg);color:var(--text);
 height:100dvh;overflow:hidden;transition:.25s;
}
button,input,textarea,select{font:inherit}
button{color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{
 outline:2px solid rgba(255,255,255,0.4);outline-offset:3px;
}

/* AUTH SCREEN */
.auth-screen{
 position:fixed;inset:0;z-index:200;
 display:flex;align-items:center;justify-content:center;
 padding:20px;background:var(--bg);overflow-y:auto;
}
.auth-box{
 width:100%;max-width:390px;padding:30px 23px;
 background:linear-gradient(145deg, #12121a, #08080c);
 border:1px solid rgba(255, 255, 255, 0.08);
 border-radius:23px;text-align:center;
 box-shadow:0 25px 60px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1);
 backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);
}
.auth-logo{
 width:65px;height:65px;margin:0 auto 17px;
 display:grid;place-items:center;border-radius:20px;
 background:linear-gradient(135deg, #2a2a3b, #111116);
 border:1px solid rgba(255, 255, 255, 0.2);
 box-shadow:0 0 20px rgba(255,255,255,0.05);
 color:white;font-size:37px;font-weight:900;
}
.auth-title{font-size:27px;font-weight:850;letter-spacing:2px}
.auth-subtitle{font-size:12px;color:var(--muted);margin:9px 0 24px}
.auth-input{
 width:100%;padding:15px;margin-bottom:11px;
 background:var(--input);border:1px solid var(--border);
 border-radius:12px;color:white;outline:none;
}
.auth-btn{
 width:100%;padding:14px;border-radius:12px;
 margin-top:9px;border:1px solid var(--border);
 background:var(--panel2);color:white;font-size:13px;font-weight:750;
 transition:.2s;
}
.auth-btn.primary{
 background:linear-gradient(135deg, #ffffff, #d0d0d8);
 color:#08080c;border:0;
 box-shadow:0 4px 20px rgba(255,255,255,0.15);
}
.auth-status{
 min-height:20px;margin-top:13px;color:var(--muted);
 font-size:11px;line-height:1.5;overflow-wrap:anywhere;
}

/* APP LAYOUT */
.app{height:100dvh;display:flex;overflow:hidden}
.sidebar{
 width:280px;min-width:280px;background:var(--panel);
 border-right:1px solid var(--border);
 display:flex;flex-direction:column;padding:18px;
 z-index:30;transition:transform .25s;
 overflow-y:auto;overflow-x:hidden;
 backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);
}
.brand{display:flex;align-items:center;gap:13px;margin-bottom:35px;padding:3px 8px;flex-shrink:0}
.logo{
 width:48px;height:48px;border-radius:16px;border:1px solid rgba(255,255,255,0.2);
 background:linear-gradient(135deg, #2a2a3b, #111116);
 display:grid;place-items:center;font-size:25px;font-weight:900;color:white;
}
.brand-name{font-size:18px;font-weight:800}
.brand-sub{font-size:11px;color:var(--muted);margin-top:2px}
.side-btn{
 width:100%;display:flex;align-items:center;gap:14px;
 padding:14px;border:1px solid transparent;background:transparent;
 border-radius:15px;color:var(--text);font-size:14px;font-weight:550;
 text-align:left;transition:.2s;margin-bottom:7px;
}
.side-btn:hover,.side-btn.active{background:var(--panel2);border-color:var(--border)}
.side-bottom{border-top:1px solid var(--border);padding-top:14px;margin-top:auto}
.profile{display:flex;align-items:center;gap:11px;padding:10px 5px}
.profile-avatar{
 width:39px;height:39px;border-radius:50%;background:#2a2a3b;
 display:grid;place-items:center;font-size:18px;color:white;
}
.profile-name{font-size:13px;font-weight:700}
.profile-sub{font-size:11px;color:var(--muted);margin-top:2px}
.logout-btn{
 margin-left:auto;background:transparent;border:1px solid var(--border);
 border-radius:9px;padding:8px;font-size:11px;color:var(--muted);
}

/* MAIN CHAT AREA */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.topbar{
 height:70px;min-height:70px;border-bottom:1px solid var(--border);
 display:flex;align-items:center;justify-content:space-between;
 padding:0 20px;background:var(--bg);
 backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);
}
.top-left{display:flex;align-items:center;gap:12px}
.top-title{font-weight:750;font-size:16px}
.icon-btn{
 width:40px;height:40px;border-radius:12px;border:1px solid var(--border);
 background:var(--panel);display:grid;place-items:center;color:var(--text);
}
.model-selector{
 background:linear-gradient(145deg, #181824, #0f0f15);
 border:1px solid rgba(255, 255, 255, 0.1);
 color:var(--text);padding:8px 12px;border-radius:12px;
 font-size:12px;font-weight:650;outline:none;
}

.chat-area{flex:1;overflow-y:auto;padding:25px 18px;scroll-behavior:smooth}
.chat-inner{max-width:850px;margin:0 auto;width:100%}
.welcome{text-align:center;padding:10vh 10px 30px}
.hero-orb{
 width:100px;height:100px;border-radius:50%;margin:0 auto 25px;
 display:grid;place-items:center;border:1px solid rgba(255,255,255,0.2);
 background:linear-gradient(135deg, #1c1c28, #0a0a0f);
 box-shadow:0 0 35px rgba(255,255,255,0.06);
 font-size:38px;font-weight:900;color:white;
}
.welcome h1{font-size:28px;font-weight:800}
.welcome p{color:var(--muted);font-size:14px;margin-top:10px}

/* MESSAGES */
.messages{display:flex;flex-direction:column;gap:20px;padding-bottom:20px}
.message{display:flex;gap:11px;animation:fadeUp .3s;max-width:100%}
.message.user{justify-content:flex-end}
.msg-avatar{
 flex-shrink:0;width:35px;height:35px;border-radius:12px;
 display:grid;place-items:center;background:var(--panel2);border:1px solid var(--border);font-weight:900;
}
.msg-content{max-width:min(82%,680px);min-width:0}
.msg-name{font-size:11px;color:var(--muted);margin:2px 0 5px}
.msg-bubble{
 background:var(--bubble);border:1px solid var(--border);
 padding:13px 15px;border-radius:5px 17px 17px 17px;
 font-size:14px;line-height:1.7;overflow-wrap:anywhere;white-space:pre-wrap;
 box-shadow:0 4px 15px rgba(0,0,0,0.2);
}
.user .msg-bubble{
 background:linear-gradient(135deg, #252538, #1a1a26);
 border-color:rgba(255,255,255,0.1);border-radius:17px 5px 17px 17px;
}
.generated-image{
 display:block;width:100%;max-width:400px;border-radius:14px;
 margin-top:10px;border:1px solid var(--border);cursor:pointer;
}

/* COMPOSER */
.composer-wrap{padding:10px 18px 17px;background:var(--bg)}
.composer{max-width:850px;margin:auto}
.photo-preview{display:none;align-items:center;gap:10px;margin-bottom:10px;padding:9px;background:var(--panel);border:1px solid var(--border);border-radius:13px}
.photo-preview img{width:50px;height:50px;object-fit:cover;border-radius:8px}
.input-box{
 display:flex;align-items:flex-end;gap:8px;padding:10px;
 border:1px solid var(--border);border-radius:25px;background:var(--input);
 backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);
}
#prompt{
 flex:1;min-width:0;max-height:130px;min-height:40px;resize:none;
 border:0;outline:0;background:transparent;color:var(--text);
 font-size:14px;line-height:1.5;padding:10px 5px;
}
.action-btn{
 width:42px;height:42px;flex-shrink:0;border-radius:50%;
 border:1px solid var(--border);background:var(--panel2);
 display:grid;place-items:center;color:var(--text);
}
.send-btn{
 background:linear-gradient(135deg, #ffffff, #d0d0d8);color:#08080c;border:0;
 font-weight:bold;box-shadow:0 4px 15px rgba(255,255,255,0.15);
}

/* GALLERY OVERLAY */
.esuka-gallery-overlay{
 display:none;position:fixed;inset:0;
 background:rgba(5,5,7,0.95);backdrop-filter:blur(20px);
 z-index:99999;align-items:center;justify-content:center;flex-direction:column;
}
.esuka-gallery-overlay.active{display:flex}
.esuka-gallery-close{
 position:absolute;top:25px;right:30px;width:45px;height:45px;
 border-radius:50%;background:rgba(255,255,255,0.1);
 border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:22px;
 display:grid;place-items:center;cursor:pointer;
}
.esuka-gallery-body img{max-width:85vw;max-height:75vh;border-radius:16px;object-fit:contain}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:760px){
 .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-105%);z-index:90}
 .sidebar.open{transform:translateX(0)}
 .mobile-backdrop.show{display:block;position:fixed;inset:0;background:#0009;z-index:80}
}
</style>
</head>

<body>

<!-- AUTH SCREEN -->
<section class="auth-screen" id="authScreen">
 <div class="auth-box">
  <div class="auth-logo">E</div>
  <div class="auth-title">ESUKA AI 2.0</div>
  <div class="auth-subtitle">Ultra-Premium Intelligence</div>
  <input class="auth-input" id="authEmail" type="email" placeholder="Email address">
  <input class="auth-input" id="authPassword" type="password" placeholder="Password">
  <button class="auth-btn primary" id="emailLoginBtn">Login</button>
  <button class="auth-btn" id="signupBtn">Create Account</button>
  <div class="auth-status" id="authStatus">Sign in to continue.</div>
 </div>
</section>

<!-- MAIN APP -->
<div class="app" id="appRoot" style="display:none">
<aside class="sidebar" id="sidebar">
 <div class="brand">
  <div class="logo">E</div>
  <div><div class="brand-name">ESUKA AI 2.0</div><div class="brand-sub">Premium Suite</div></div>
 </div>
 <button class="side-btn active" id="newChatBtn">New Chat</button>
 <button class="side-btn" id="sideImageBtn">Image Mode</button>
 <div class="side-bottom">
  <div class="profile">
   <div class="profile-avatar">E</div>
   <div style="min-width:0">
    <div class="profile-name" id="profileEmailUser">User</div>
    <div class="profile-sub">Lifetime Free</div>
   </div>
   <button class="logout-btn" id="logoutBtn">Logout</button>
  </div>
 </div>
</aside>
<div class="mobile-backdrop" id="backdrop"></div>

<main class="main">
 <header class="topbar">
  <div class="top-left">
   <button class="icon-btn" id="menuBtn">☰</button>
   <div class="top-title">ESUKA 2.0</div>
   <select class="model-selector" id="modelSelect">
    <option value="groq">Groq (Ultra-Fast)</option>
    <option value="gemini">Gemini 2.0 (Smart)</option>
    <option value="deepseek">DeepSeek-R1 (Reasoning)</option>
   </select>
  </div>
 </header>

 <section class="chat-area" id="chatArea">
  <div class="chat-inner">
   <div class="welcome" id="welcome">
    <div class="hero-orb">E2</div>
    <h1>ESUKA AI 2.0</h1>
    <p>Select your preferred model above and begin...</p>
   </div>
   <div class="messages" id="messages"></div>
  </div>
 </section>

 <div class="composer-wrap">
  <div class="composer">
   <div class="photo-preview" id="esukaPhotoPreview">
    <img id="esukaPhotoThumb" alt="Preview">
    <span style="font-size:12px">Photo attached</span>
    <button type="button" class="action-btn" style="width:30px;height:30px;margin-left:auto" id="esukaRemovePhoto">✕</button>
   </div>
   <div class="input-box">
    <button class="action-btn" id="attachBtn" title="Upload Photo">📁</button>
    <input id="esukaFileInput" type="file" accept="image/*" hidden>
    <textarea id="prompt" rows="1" placeholder="Type a message..."></textarea>
    <button class="action-btn send-btn" id="sendBtn">➔</button>
   </div>
  </div>
 </div>
</main>
</div>

<!-- GALLERY OVERLAY -->
<div id="esukaGalleryModal" class="esuka-gallery-overlay">
 <button class="esuka-gallery-close" onclick="closeEsukaGallery()">✕</button>
 <div class="esuka-gallery-body" id="esukaGalleryMedia"></div>
</div>

<script>
"use strict";
const SUPABASE_URL="https://tdpiviiihjaiizltoegt.supabase.co";
const SUPABASE_KEY="sb_publishable_yJjz9rjnsvMV6bW6DGKi2g_bJWY1CSw";
const API_URL="https://esuka-ai-web.kataribhai1.workers.dev/";

const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentSession=null;
let imageMode=false;
let busy=false;
let attachedPhotoData="";
const $=id=>document.getElementById(id);

async function initAuth(){
 const {data}=await supabaseClient.auth.getSession();
 if(data.session) showApp(data.session); else showAuth();
}
function showAuth(){ $("authScreen").style.display="flex"; $("appRoot").style.display="none"; }
function showApp(session){
 currentSession=session;
 $("authScreen").style.display="none";
 $("appRoot").style.display="flex";
 if(session.user?.email) $("profileEmailUser.textContent")=session.user.email;
}

$("emailLoginBtn").onclick=async()=>{
 const {data,error}=await supabaseClient.auth.signInWithPassword({email:$("authEmail").value,password:$("authPassword").value});
 if(error) $("authStatus").textContent=error.message; else showApp(data.session);
};
$("signupBtn").onclick=async()=>{
 const {error}=await supabaseClient.auth.signUp({email:$("authEmail").value,password:$("authPassword").value});
 if(error) $("authStatus").textContent=error.message; else $("authStatus").textContent="Verification email sent!";
};
$("logoutBtn").onclick=async()=>{ await supabaseClient.auth.signOut(); showAuth(); };

$("attachBtn").onclick=()=>$("esukaFileInput").click();
$("esukaFileInput").onchange=e=>{
 const file=e.target.files[0]; if(!file)return;
 const reader=new FileReader();
 reader.onload=evt=>{
  attachedPhotoData=evt.target.result;
  $("esukaPhotoThumb").src=attachedPhotoData;
  $("esukaPhotoPreview").style.display="flex";
 };
 reader.readAsDataURL(file);
};
$("esukaRemovePhoto").onclick=()=>{
 attachedPhotoData=""; $("esukaPhotoPreview").style.display="none";
};

function openEsukaGallery(url){
 $("esukaGalleryMedia").innerHTML=`<img src="${url}">`;
 $("esukaGalleryModal").classList.add("active");
}
function closeEsukaGallery(){ $("esukaGalleryModal").classList.remove("active"); }

function addMessage(role,text){
 $("welcome").style.display="none";
 const row=document.createElement("div");
 row.className="message "+(role==="user"?"user":"assistant");
 row.innerHTML=`<div class="msg-avatar">${role==="user"?"U":"E"}</div><div class="msg-content"><div class="msg-name">${role==="user"?"You":"ESUKA 2.0"}</div><div class="msg-bubble">${text}</div></div>`;
 $("messages").appendChild(row);
 $("chatArea").scrollTop=$("chatArea").scrollHeight;
}

function addImage(url){
 const last=$("messages").lastElementChild.querySelector(".msg-content");
 const img=document.createElement("img");
 img.className="generated-image"; img.src=url;
 img.onclick=()=>openEsukaGallery(url);
 last.appendChild(img);
}

$("sendBtn").onclick=async()=>{
 const text=$("prompt").value.trim();
 const selectedModel=$("modelSelect").value;
 if((!text && !attachedPhotoData) || busy) return;

 $("prompt").value="";
 addMessage("user", text || "📷 Photo attached");
 busy=true;

 try{
  const res=await fetch(API_URL,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    message: text,
    model: selectedModel,
    mode: attachedPhotoData ? "analyze" : (imageMode ? "image" : "chat"),
    image: attachedPhotoData || null
   })
  });
  const data=await res.json();
  if(imageMode && data.image){
   addMessage("assistant","Here is your generated image:");
   addImage(data.image);
  } else {
   addMessage("assistant", data.reply || data.answer || "Response received.");
  }
 }catch(e){
  addMessage("assistant","Error: "+e.message);
 }finally{
  busy=false; attachedPhotoData=""; $("esukaPhotoPreview").style.display="none";
 }
};

$("menuBtn").onclick=()=>{ $("sidebar").classList.toggle("open"); $("backdrop").classList.toggle("show"); };
$("backdrop").onclick=()=>{ $("sidebar").classList.remove("open"); $("backdrop").classList.remove("show"); };
$("sideImageBtn").onclick=()=>{ imageMode=!imageMode; alert("Image Mode: "+(imageMode?"ON (Next prompt will generate image)":"OFF")); };

initAuth();
</script>
</body>
</html>
